name: Build Ornon Panel

on:
  push:
    branches:
      - main

permissions:
    packages: write
    contents: read

jobs:
  build-ornon:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push Ornon panel image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          # GHCR image paths must be lowercase, so the owner is hardcoded rather
          # than taken from ${{ github.repository_owner }} (TheOrnonNetwork).
          tags: |
            ghcr.io/theornonnetwork/ornon-panel:latest
            ghcr.io/theornonnetwork/ornon-panel:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
